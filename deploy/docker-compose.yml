version: '3.8'

services:
  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - UNICOMPUTE_LISTEN=0.0.0.0:8080
      - UNICOMPUTE_PUBLIC_IP=${PUBLIC_IP:-}
      - UNICOMPUTE_REALM=${REALM:-unicompute.edu}
      - UNICOMPUTE_TURN_SECRET=${TURN_SECRET:-}
      - UNICOMPUTE_AUTH_TOKEN=${AUTH_TOKEN:-}
    ports:
      - "8080:8080"      # Internal / Direct WebSocket signaling
      - "3478:3478/udp"  # STUN / Embedded TURN UDP port
    networks:
      - unicompute-net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP (redirects to HTTPS / ACME challenges)
      - "443:443"  # HTTPS & WSS (Secure WebSocket Signaling)
    environment:
      - COORDINATOR_DOMAIN=${DOMAIN:-coordinator.unicompute.edu}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - coordinator
    networks:
      - unicompute-net

networks:
  unicompute-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
