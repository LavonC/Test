<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniCompute — Distributed Volunteer Computing Platform</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-[#F8FAFC] text-slate-900 antialiased overflow-x-hidden">
  <!-- Mobile Sidebar Backdrop -->
  <div id="mobileBackdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 hidden lg:hidden" data-action="close-mobile-nav"></div>

  <div class="min-h-screen flex">
    <!-- Left Sidebar -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-50 h-screen w-60 bg-white border-r border-slate-200 flex flex-col transition-transform duration-200 -translate-x-full lg:translate-x-0 shrink-0">
      <div class="h-16 px-4 border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center">
            <i data-lucide="boxes" class="w-4 h-4"></i>
          </div>
          <span class="text-sm font-bold tracking-tight text-slate-900">UniCompute</span>
        </div>
        <button type="button" class="lg:hidden p-1.5 rounded-lg text-slate-500 hover:bg-slate-100" data-action="close-mobile-nav" aria-label="Close navigation">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-5">
        <div>
          <div class="px-2.5 mb-2 text-[10px] font-semibold uppercase tracking-wider text-slate-400">Coordinator</div>
          <div class="space-y-0.5">
            <button type="button" data-nav="overview" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i><span>Overview</span>
            </button>
            <button type="button" data-nav="topology" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="share-2" class="w-4 h-4 shrink-0"></i><span>Network Topology</span>
            </button>
            <button type="button" data-nav="sandbox" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="code-2" class="w-4 h-4 shrink-0"></i><span>CPU Sandbox &amp; Shell</span>
            </button>
            <button type="button" data-nav="gpu" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="cpu" class="w-4 h-4 shrink-0"></i><span>GPU Compute</span>
            </button>
            <button type="button" data-nav="tasks" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="list-checks" class="w-4 h-4 shrink-0"></i><span>Task Queue</span>
              <span id="navTaskBadge" class="ml-auto text-[11px] font-mono-code opacity-75">0</span>
            </button>
            <button type="button" data-nav="storage" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="database" class="w-4 h-4 shrink-0"></i><span>Storage &amp; Blobs</span>
            </button>
          </div>
        </div>

        <div>
          <div class="px-2.5 mb-2 text-[10px] font-semibold uppercase tracking-wider text-slate-400">Worker</div>
          <div class="space-y-0.5">
            <button type="button" data-nav="worker" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="shield-check" class="w-4 h-4 shrink-0"></i><span>Worker Allowlist</span>
            </button>
            <button type="button" data-nav="nodes" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="server" class="w-4 h-4 shrink-0"></i><span>Nodes</span>
            </button>
          </div>
        </div>

        <div>
          <div class="px-2.5 mb-2 text-[10px] font-semibold uppercase tracking-wider text-slate-400">System</div>
          <div class="space-y-0.5">
            <button type="button" data-nav="logs" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="terminal" class="w-4 h-4 shrink-0"></i><span>Logs</span>
            </button>
            <button type="button" data-nav="settings" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="sliders-horizontal" class="w-4 h-4 shrink-0"></i><span>Settings</span>
            </button>
            <button type="button" data-nav="attribution" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="layers" class="w-4 h-4 shrink-0"></i><span>Architecture</span>
            </button>
          </div>
        </div>
      </nav>

      <div class="px-4 py-3 border-t border-slate-200 flex items-center gap-2.5">
        <span id="sidebarStatusDot" class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
        <div class="min-w-0">
          <div id="sidebarCoordinatorName" class="text-xs font-semibold text-slate-800 truncate">UniCompute Node</div>
          <div id="sidebarNodeSummary" class="text-[11px] text-slate-500">Connecting...</div>
        </div>
      </div>
    </aside>

    <!-- Main Content Column -->
    <div class="flex-1 min-w-0 flex flex-col">
      <header class="sticky top-0 z-30 h-16 bg-white/95 backdrop-blur border-b border-slate-200 px-4 lg:px-8 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button type="button" class="lg:hidden p-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50" data-action="open-mobile-nav" aria-label="Open menu">
            <i data-lucide="menu" class="w-4 h-4"></i>
          </button>
          <h1 id="topbarTitle" class="text-base font-bold text-slate-900 truncate">Overview</h1>
          <span id="topbarPill" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
            <span>Connecting...</span>
          </span>
        </div>

        <div class="flex items-center gap-2.5 shrink-0">
          <button type="button" data-action="open-create-task" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition-colors">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>New Task</span>
          </button>
        </div>
      </header>

      <!-- 401 AUTH_REQUIRED Coordinator Banner -->
      <div id="coordAuthBanner" class="hidden bg-amber-50 border-b border-amber-200 px-4 lg:px-8 py-2.5">
        <div class="max-w-[1380px] mx-auto flex flex-wrap items-center justify-between gap-3 text-xs text-amber-900">
          <div class="flex items-center gap-2">
            <i data-lucide="shield-alert" class="w-4 h-4 text-amber-600 shrink-0"></i>
            <span><strong>Coordinator Authentication Required (401):</strong> Supply the cluster <code class="font-mono-code">UNICOMPUTE_AUTH_TOKEN</code> to query fleet nodes and register signaling.</span>
          </div>
          <button type="button" data-action="goto-settings" class="px-3 py-1 rounded-lg bg-amber-900 hover:bg-amber-800 text-white font-semibold shrink-0">Configure Auth Token</button>
        </div>
      </div>

      <main id="pageContainer" class="flex-1 p-4 lg:p-8 max-w-[1380px] w-full mx-auto">
        <!-- Rendered by js/app.js -->
      </main>
    </div>
  </div>

  <!-- Reusable Modal Backdrop -->
  <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden items-center justify-center p-4" data-action="close-modal">
    <div id="modalCard" class="bg-white border border-slate-200 rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
        <h3 id="modalTitle" class="text-sm font-bold text-slate-900">Modal</h3>
        <button type="button" data-action="close-modal" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100" aria-label="Close modal">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modalBody" class="p-5"></div>
    </div>
  </div>

  <!-- Toast Stack -->
  <div id="toastStack" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script src="/js/app.js"></script>
</body>
</html>
