<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniCompute — Distributed Volunteer Computing Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    @keyframes dashFlow {
      to { stroke-dashoffset: -24; }
    }
    .flow-line {
      stroke-dasharray: 5 5;
      animation: dashFlow 1.6s linear infinite;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 9999px;
      background: #E2E8F0;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 9999px;
      background: #0F172A;
      border: 2px solid #FFFFFF;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
      cursor: pointer;
    }
    .nav-active {
      background-color: #0F172A;
      color: #FFFFFF;
    }
    .nav-active svg {
      color: #FFFFFF;
    }
    .nav-idle {
      color: #475569;
    }
    .nav-idle:hover {
      background-color: #F1F5F9;
      color: #0F172A;
    }
    .shard-grid-18 {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 6px;
    }
    @media (min-width: 640px) {
      .shard-grid-18 {
        grid-template-columns: repeat(18, minmax(0, 1fr));
      }
    }
    .shard-cell {
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .shard-cell:hover {
      transform: scale(1.2);
      z-index: 5;
      box-shadow: 0 2px 6px rgba(15,23,42,0.16);
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 antialiased overflow-x-hidden">
  <!-- Mobile Sidebar Backdrop -->
  <div id="mobileBackdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 hidden lg:hidden" onclick="toggleMobileNav(false)"></div>

  <div class="min-h-screen flex">
    <!-- Left Sidebar -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-50 h-screen w-60 bg-white border-r border-slate-200 flex flex-col transition-transform duration-200 -translate-x-full lg:translate-x-0 shrink-0">
      <div class="h-16 px-4 border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center">
            <i data-lucide="boxes" class="w-4 h-4"></i>
          </div>
          <span class="text-sm font-bold tracking-tight text-slate-900">UniCompute</span>
        </div>
        <button type="button" class="lg:hidden p-1.5 rounded-lg text-slate-500 hover:bg-slate-100" onclick="toggleMobileNav(false)" aria-label="Close navigation">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-5">
        <div>
          <div class="px-2.5 mb-2 text-[10px] font-semibold uppercase tracking-wider text-slate-400">Coordinator</div>
          <div class="space-y-0.5">
            <button type="button" data-nav="overview" onclick="navigate('overview')" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i><span>Overview</span>
            </button>
            <button type="button" data-nav="topology" onclick="navigate('topology')" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="share-2" class="w-4 h-4 shrink-0"></i><span>Network Topology</span>
            </button>
            <button type="button" data-nav="gpu" onclick="navigate('gpu')" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="cpu" class="w-4 h-4 shrink-0"></i><span>GPU Compute</span>
            </button>
            <button type="button" data-nav="tasks" onclick="navigate('tasks')" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">

            </button>
            <button type="button" data-nav="storage" onclick="navigate('storage')" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="database" class="w-4 h-4 shrink-0"></i><span>Storage &amp; Shards</span>
            </button>
          </div>
        </div>

        <div>
          <div class="px-2.5 mb-2 text-[10px] font-semibold uppercase tracking-wider text-slate-400">Worker</div>
          <div class="space-y-0.5">
            <button type="button" data-nav="worker" onclick="navigate('worker')" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="shield-check" class="w-4 h-4 shrink-0"></i><span>Sandbox Setup</span>
            </button>
            <button type="button" data-nav="nodes" onclick="navigate('nodes')" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="server" class="w-4 h-4 shrink-0"></i><span>Nodes</span>

          </div>
        </div>

        <div>
          <div class="px-2.5 mb-2 text-[10px] font-semibold uppercase tracking-wider text-slate-400">System</div>
          <div class="space-y-0.5">
            <button type="button" data-nav="logs" onclick="navigate('logs')" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="terminal" class="w-4 h-4 shrink-0"></i><span>Logs</span>
            </button>
            <button type="button" data-nav="settings" onclick="navigate('settings')" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">

            <button type="button" data-nav="attribution" onclick="navigate('attribution')" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-medium transition-colors">
              <i data-lucide="layers" class="w-4 h-4 shrink-0"></i><span>Design Notes</span>
            </button>
          </div>
        </div>
      </nav>

      <div class="px-4 py-3 border-t border-slate-200 flex items-center gap-2.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
        <div class="min-w-0">
          <div id="sidebarCoordinatorName" class="text-xs font-semibold text-slate-800 truncate">UniCompute Node</div>
          <div id="sidebarNodeSummary" class="text-[11px] text-slate-500">Connecting...</div>
        </div>
      </div>
    </aside>

    <!-- Main Content Column -->
    <div class="flex-1 min-w-0 flex flex-col">
      <header class="sticky top-0 z-30 h-16 bg-white/95 backdrop-blur border-b border-slate-200 px-4 lg:px-8 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button type="button" class="lg:hidden p-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50" onclick="toggleMobileNav(true)" aria-label="Open menu">
            <i data-lucide="menu" class="w-4 h-4"></i>
          </button>
          <h1 id="topbarTitle" class="text-base font-bold text-slate-900 truncate">Overview</h1>
          <span id="topbarPill" class="hidden sm:inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            <span>Online</span>
          </span>
        </div>

        <div class="flex items-center gap-2.5 shrink-0">
          <button type="button" onclick="copyJoinCode()" class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-50 hover:bg-slate-100 border border-slate-200 text-xs font-mono-code text-slate-700 transition-colors" title="Copy cluster join code">
            <span class="text-slate-400">Join</span>
            <span id="topbarJoinCode" class="font-semibold text-slate-900">UC-LOCAL</span>
            <i data-lucide="copy" class="w-3.5 h-3.5 text-slate-400"></i>
          </button>
          <button type="button" onclick="openCreateTask()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition-colors">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>New Task</span>
          </button>
        </div>
      </header>

      <main id="pageContainer" class="flex-1 p-4 lg:p-8 max-w-[1380px] w-full mx-auto">
        <!-- Rendered by JS -->
      </main>
    </div>
  </div>

  <!-- Reusable Modal Backdrop -->
  <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden items-center justify-center p-4" onclick="closeModal()">
    <div id="modalCard" class="bg-white border border-slate-200 rounded-2xl shadow-xl w-full max-w-lg overflow-hidden" onclick="event.stopPropagation()">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
        <h3 id="modalTitle" class="text-sm font-bold text-slate-900">Modal</h3>
        <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100" aria-label="Close modal">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modalBody" class="p-5"></div>
    </div>
  </div>

  <!-- Toast Stack -->
  <div id="toastStack" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    // =========================================================================
    // AUTH TOKEN & API INTERCEPTOR (matches cmd/unicompute-gui/api.go)
    // =========================================================================
    (function() {
      const hash = window.location.hash || '';
      const match = hash.match(/token=([a-fA-F0-9]+)/);
      if (match && match[1]) {
        sessionStorage.setItem('unicompute_gui_token', match[1]);
      }
    })();

    function getAuthToken() {
      return sessionStorage.getItem('unicompute_gui_token') || '';
    }

    const _originalFetch = window.fetch;
    window.fetch = function(url, options = {}) {
      const token = getAuthToken();
      const headers = new Headers(options.headers || {});
      if (token && !headers.has('Authorization')) {
        headers.set('Authorization', 'Bearer ' + token);
      }
      const method = (options.method || 'GET').toUpperCase();
      if ((method === 'POST' || method === 'PUT' || method === 'DELETE') && !headers.has('Content-Type')) {
        headers.set('Content-Type', 'application/json');
      }
      options.headers = headers;
      return _originalFetch(url, options);
    };

    // =========================================================================
    // DEFAULT SETTINGS & STATE
    // =========================================================================
    const defaultSettings = {
      coordinatorName: 'Alpha-Coordinator',
      joinCode: 'UC-9F4A',
      safemodeSeconds: 30,
      staleTimeoutSec: 15,
      deadTimeoutMin: 20,
      quicPort: '4194',
      stunServer: 'stun:stun.l.google.com:19302',
      enableTcpRelay: true,
      enableFederation: false,
      maxPeers: 64,
      allowRegistration: true,
      requireEd25519: true,
      sarmentaSpotCheck: true,
      spotCheckRate: 10,
      enforceOfflineSandbox: true,
      cpuCeiling: 80,
      gpuThermalCutoff: 85,
      pauseOnBattery: true,
      erasurePolicy: 'RS(6,3)'
    };

    function loadSavedSettings() {
      try {
        const raw = localStorage.getItem('unicompute_settings_v1');
        if (raw) return { ...defaultSettings, ...JSON.parse(raw) };
      } catch (e) {}
      return { ...defaultSettings };
    }

    const defaultCudaSample = `#include <stdio.h>
#include <stdlib.h>
#include <cuda_runtime.h>

__global__ void vectorAdd(const float *A, const float *B, float *C, int N) {
    int i = blockDim.x * blockIdx.x + threadIdx.x;
    if (i < N) {
        C[i] = A[i] + B[i];
    }
}

int main() {
    int N = 1024;
    size_t size = N * sizeof(float);
    float *d_A = NULL, *d_B = NULL, *d_C = NULL;
    cudaMalloc((void **)&d_A, size);
    cudaMalloc((void **)&d_B, size);
    cudaMalloc((void **)&d_C, size);
    vectorAdd<<<4, 256>>>(d_A, d_B, d_C, N);
    cudaDeviceSynchronize();
    cudaFree(d_A);
    cudaFree(d_B);
    cudaFree(d_C);
    return 0;
}`;

    const state = {
      currentPage: 'overview',
      backendConnected: false,
      localNodeId: 'local-node',
      localGpuProfile: null,
      localWatchdog: null,
      selectedTopoNodeId: 'local-node',
      topoViewMode: 'orbital',
      gpuRuntimeTab: 'hipify',
      gpuProvider: 'Auto-Route',
      gpuInterruptible: true,
      gpuCheckpointInterval: 'Every 5 mins',
      gpuSelectedFile: 'vector_add.cu',
      cudaSamples: [],
      cudaSource: defaultCudaSample,
      hipSource: '',
      hipifyResult: null,
      hipifyRunning: false,
      hipifyStatus: 'idle',
      workerActive: true,
      workerBenchmark: null,
      workerTiers: {
        t1: { enabled: true, ramGb: 2 },
        t2: { enabled: true, cpuCores: 8, ramGb: 16 },
        t3: { enabled: true }
      },
      claimedTaskId: null,
      claimedProgress: 0,
      claimTimer: null,
      taskFilterTab: 'All',
      taskSearch: '',
      selectedTaskId: '',
      taskLogStreamFilter: 'all',
      createForm: {
        mode: 'single',
        title: '',
        tier: 'Tier 3 GPU',
        runtime: 'ONNX Runtime',
        provider: 'Auto-Route',
        timeoutSec: 25,
        cpuCores: 4,
        ramGb: 8,
        checkpointing: true,
        checkpointInterval: 'Every 5 mins',
        dataSourceType: 'vault',
        selectedVaultId: 'ds-local',
        newFileName: '',
        entryFile: 'infer_resnet50.onnx',
        targetNode: 'Auto',
        stages: [
          { name: 'Preprocess & Normalize', tier: 'Tier 2 Container', runtime: 'Python 3.12', inputType: 'vault', inputRef: 'ds-local' },
          { name: 'Batch AI Inference', tier: 'Tier 3 GPU', runtime: 'ONNX Runtime', inputType: 'stage', inputRef: 'stage-0' },
          { name: 'Aggregate Predictions', tier: 'Tier 1 WASI', runtime: 'Pyodide', inputType: 'stage', inputRef: 'stage-1' }
        ]
      },
      vaultDatasets: [
        { id: 'ds-local', path: '/vault/local-chunks', size: '0 B', cachedOn: ['local-node'] }
      ],
      nodeSearch: '',
      nodeTierFilter: 'All',
      nodeStatusFilter: 'All',
      logTab: 'All',
      logSeverity: 'All',
      logSearch: '',
      settingsTab: 0,
      settingsDirty: false,
      settings: loadSavedSettings(),
      nodes: [],
      tasks: [],
      shardMatrix: [
        Array(18).fill('ok'),
        Array(18).fill('ok'),
        Array(18).fill('ok'),
        Array(18).fill('ok')
      ],
      logs: []
    };

    // =========================================================================
    // BACKEND DATA SYNC & WEBSOCKET
    // =========================================================================
    async function syncBackend() {
      try {
        const [statusRes, gpuRes, fleetRes, tasksRes, blobsRes] = await Promise.allSettled([
          fetch('/api/status').then(r => r.ok ? r.json() : null),
          fetch('/api/gpu').then(r => r.ok ? r.json() : null),
          fetch('/api/fleet').then(r => r.ok ? r.json() : null),
          fetch('/api/tasks').then(r => r.ok ? r.json() : null),
          fetch('/api/storage/blobs').then(r => r.ok ? r.json() : null)
        ]);

        const status = statusRes.status === 'fulfilled' ? statusRes.value : null;
        const gpuData = gpuRes.status === 'fulfilled' ? gpuRes.value : null;
        const fleetData = fleetRes.status === 'fulfilled' ? fleetRes.value : null;
        const tasksData = tasksRes.status === 'fulfilled' ? tasksRes.value : null;
        const blobsData = blobsRes.status === 'fulfilled' ? blobsRes.value : null;

        if (status) {
          state.backendConnected = true;
          state.localNodeId = status.node_id || state.localNodeId;
          if (status.join_token) state.settings.joinCode = status.join_token;
          if (status.coordinator_url) state.settings.coordinatorName = status.pool_id || 'UniCompute Pool';
        }

        if (gpuData && gpuData.profile) {
          state.localGpuProfile = gpuData.profile;
          state.localWatchdog = gpuData.watchdog || null;
        }

        // Build live nodes list from local node + fleet
        const nodeList = [];
        const prof = state.localGpuProfile || (status && status.gpu_profile) || {};
        const vramTotalGB = prof.vram_mb ? Number((prof.vram_mb / 1024).toFixed(1)) : 0;
        const gpuVendor = prof.vendor || 'Unknown';
        const gpuName = prof.name || 'CPU / Integrated';
        const runtimes = [];
        if (prof.cuda_supported) runtimes.push('CUDA');
        if (prof.hip_supported) runtimes.push('HIP / ROCm');
        if (prof.directml_supported) runtimes.push('ONNX / DirectML');
        if (!runtimes.length) runtimes.push('Wasmtime', 'HIPIFY');

        nodeList.push({
          id: state.localNodeId,
          lab: 'Local Host',
          tier: vramTotalGB > 0 ? 'Tier 3 GPU' : 'Tier 2 Container',
          os: 'Windows 11',
          cpuModel: 'Host CPU',
          cpuUse: 24,
          gpuModel: gpuName,
          gpuVendor: gpuVendor,
          gpuUse: prof.utilization_pct || 18,
          vramUsed: vramTotalGB ? Number((vramTotalGB * 0.25).toFixed(1)) : 0,
          vramTotal: vramTotalGB,
          tempC: prof.temp_c || 52,
          ramUsed: 12,
          ramTotal: 32,
          rttMs: 1,
          transport: 'Local Host',
          status: 'Online',
          heartbeat: 'Live',
          shardsData: blobsData && Array.isArray(blobsData.blobs) ? blobsData.blobs.length : 0,
          shardsParity: 0,
          runtimes,
          gpuIncluded: true,
          workload: 'HIPIFY / Compute Ready',
          color: '#0284C7',
          pos: [50, 20]
        });

        if (fleetData && Array.isArray(fleetData.nodes)) {
          fleetData.nodes.forEach((fn, idx) => {
            if (fn.node_id === state.localNodeId) return;
            const angle = ((idx + 1) / (fleetData.nodes.length + 1)) * Math.PI * 2;
            const px = Math.round(50 + 32 * Math.cos(angle));
            const py = Math.round(50 + 34 * Math.sin(angle));
            nodeList.push({
              id: fn.node_id || ('Peer-' + (idx + 1)),
              lab: fn.pool_id || 'Remote Pool',
              tier: fn.gpu_vram_mb > 0 ? 'Tier 3 GPU' : 'Tier 2 Container',
              os: fn.os || 'Linux/Win',
              cpuModel: fn.cpu_model || 'Peer CPU',
              cpuUse: 30,
              gpuModel: fn.gpu_name || 'Peer GPU',
              gpuVendor: fn.gpu_vendor || 'Unknown',
              gpuUse: 20,
              vramUsed: fn.gpu_vram_mb ? Number((fn.gpu_vram_mb / 1024 * 0.3).toFixed(1)) : 0,
              vramTotal: fn.gpu_vram_mb ? Number((fn.gpu_vram_mb / 1024).toFixed(1)) : 0,
              tempC: 58,
              ramUsed: 8,
              ramTotal: 32,
              rttMs: fn.rtt_ms || 24,
              transport: fn.transport || 'Direct WebRTC',
              status: fn.online === false ? 'Stale' : 'Online',
              heartbeat: 'Active',
              shardsData: 2,
              shardsParity: 1,
              runtimes: ['ONNX / DirectML'],
              gpuIncluded: true,
              workload: 'Idle',
              color: '#059669',
              pos: [px, py]
            });
          });
        }

        state.nodes = nodeList;
        if (!state.nodes.find(n => n.id === state.selectedTopoNodeId)) {
          state.selectedTopoNodeId = state.localNodeId;
        }

        if (tasksData && Array.isArray(tasksData.tasks)) {
          state.tasks = tasksData.tasks.map(t => ({
            id: t.job_id || t.id,
            title: t.class_ad || t.stage_dag || t.job_id,
            kind: t.stage_dag || 'Cluster Task',
            tier: (t.target_match || '').includes('Tier 3') ? 'Tier 3 GPU' : 'Tier 2 Container',
            runtime: t.stage_dag || 'UniCompute',
            specs: t.target_match || 'Auto-matched',
            dataset: '/vault/workspace',
            outputRef: t.job_id || 'obj:output',
            worker: t.target_match || state.localNodeId,
            locality: 'Node-Local',
            verification: 'Ed25519 Armed',
            eta: t.status === 'COMPLETED' ? 'Done' : 'Active',
            progress: t.status === 'COMPLETED' ? 100 : (t.status === 'FAILED' ? 0 : 50),
            status: t.status === 'COMPLETED' ? 'Completed' : (t.status === 'FAILED' ? 'Failed' : 'Running'),
            stages: null,
            execLogs: [
              { ts: t.created_at || new Date().toTimeString().slice(0, 8), stream: 'stdout', line: t.output || t.class_ad || 'Task recorded on node.' }
            ]
          }));
          if (!state.selectedTaskId && state.tasks.length) {
            state.selectedTaskId = state.tasks[0].id;
          }
        }

        if (blobsData && Array.isArray(blobsData.blobs)) {
          state.vaultDatasets = blobsData.blobs.map((b, i) => ({
            id: 'blob-' + i,
            path: '/vault/' + (b.key || b.cid || ('chunk-' + i)),
            size: b.size ? `${Math.round(b.size / 1024)} KB` : 'Chunk',
            cachedOn: [state.localNodeId]
          }));
          if (!state.vaultDatasets.length) {
            state.vaultDatasets = [{ id: 'ds-local', path: '/vault/empty', size: '0 B', cachedOn: [state.localNodeId] }];
          }
        }

        updateChrome();
        // Re-render current page smoothly unless user is actively typing in an input/textarea
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        if (activeTag !== 'TEXTAREA' && activeTag !== 'INPUT' && activeTag !== 'SELECT') {
          renderCurrentPageOnly();
        }
      } catch (err) {
        console.warn('Backend sync warning:', err);
      }

    async function loadSamplesFromBackend() {
      try {
        const res = await fetch('/api/samples');
        if (!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data) ? data : (data.samples || []);
        state.cudaSamples = items.filter(s => s.language === 'cuda' || (s.name && s.name.endsWith('.cu')));
        if (state.cudaSamples.length > 0 && state.cudaSource === defaultCudaSample) {
          state.gpuSelectedFile = state.cudaSamples[0].name;
          state.cudaSource = state.cudaSamples[0].content;
        }
        if (state.currentPage === 'gpu') {
          renderGpuCompute(document.getElementById('pageContainer'));
          if (window.lucide) lucide.createIcons();
        }
      } catch (e) {}
    }

    function initWebSocket() {
      try {
        const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const token = getAuthToken();
        const wsUrl = `${proto}//${window.location.host}/api/events${token ? '?token=' + encodeURIComponent(token) : ''}`;
        const ws = new WebSocket(wsUrl);
        ws.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            state.logs.unshift({
              ts: new Date().toTimeString().slice(0, 8),
              sev: msg.level === 'error' ? 'Error' : (msg.level === 'warn' ? 'Warning' : 'Info'),
              cat: msg.category || 'Coordinator',
              src: msg.source || state.localNodeId,
              type: msg.type || 'Event',
              msg: msg.message || JSON.stringify(msg)
            });
            if (state.logs.length > 100) state.logs.pop();
            if (state.currentPage === 'logs' || state.currentPage === 'overview') {
              renderCurrentPageOnly();
            }
          } catch (e) {}
        };
      } catch (e) {}
    }

    let activeCharts = [];
    function destroyCharts() {

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
    }

    function showToast(message, tone = 'success') {
      const stack = document.getElementById('toastStack');
      const el = document.createElement('div');
      const iconName = tone === 'warning' ? 'alert-triangle' : tone === 'info' ? 'info' : 'check-circle-2';
      const iconColor = tone === 'warning' ? 'text-amber-400' : tone === 'info' ? 'text-sky-400' : 'text-emerald-400';
      el.className = 'pointer-events-auto flex items-center gap-2.5 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg border border-slate-700 max-w-sm';
      el.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4 shrink-0 ${iconColor}"></i><span>${escapeHtml(message)}</span>`;
      stack.appendChild(el);
      if (window.lucide) lucide.createIcons({ nodes: [el] });
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3000);
    }

    function copyText(text, label = 'Copied to clipboard') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(label)).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }
    function copyJoinCode() { copyText(state.settings.joinCode, `Join code ${state.settings.joinCode} copied`); }
    function fallbackCopy(text, label) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(label); } catch (e) {}
      ta.remove();
    }

    function handleCudaFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      state.gpuSelectedFile = file.name;
      const reader = new FileReader();
      reader.onload = (ev) => {
        state.cudaSource = ev.target.result;
        const ed = document.getElementById('cudaEditor');
        if (ed) ed.value = state.cudaSource;
        runHipify();
      };
      reader.readAsText(file);
    }

    function handleSampleSelect(idxStr) {
      if (idxStr === '') return;
      const sample = state.cudaSamples[Number(idxStr)];
      if (!sample) return;
      state.gpuSelectedFile = sample.name;
      state.cudaSource = sample.content;
      state.hipSource = '';
      state.hipifyResult = null;
      renderGpuCompute(document.getElementById('pageContainer'));
      if (window.lucide) lucide.createIcons();
    }

    async function runHipify() {
      const ed = document.getElementById('cudaEditor');
      const source = ed ? ed.value : state.cudaSource;
      state.cudaSource = source;
      if (!source.trim()) {
        showToast('Please select or paste CUDA C++ source code', 'warning');
        return;
      }
      state.hipifyRunning = true;
      renderGpuCompute(document.getElementById('pageContainer'));
      if (window.lucide) lucide.createIcons();

      try {
        const resp = await fetch('/api/gpu/hipify', {
          method: 'POST',
          body: JSON.stringify({ source })
        });
        const res = await resp.json();
        state.hipifyResult = res;
        state.hipSource = res.translated_source || '// Translation blocked due to compatibility issues.';
        state.hipifyStatus = res.success ? 'clean' : 'warning';
        if (res.success) {
          showToast(`Translated ${res.replacements_made || 0} references via ${res.engine || 'hipify-clang.exe'}`);
        } else {
          showToast(res.error || 'HIPIFY reported compatibility issues', 'warning');
        }
      } catch (err) {
        showToast('HIPIFY API request failed: ' + err.message, 'warning');
      } finally {
        state.hipifyRunning = false;
        renderGpuCompute(document.getElementById('pageContainer'));
        if (window.lucide) lucide.createIcons();
      }
    }

    function downloadHipFile() {
      if (!state.hipSource) return;
      const outName = state.gpuSelectedFile.replace(/\.(cu|cuh|cpp|h|c)$/i, '') + '.hip';
      const blob = new Blob([state.hipSource], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = outName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 500);
      showToast(`Downloaded ${outName}`);
    }

    function setGpuRuntimeTab(tab) {
      state.gpuRuntimeTab = tab;
      if (tab === 'hipify' && state.gpuProvider === 'CUDA') state.gpuProvider = 'ROCm';
      renderGpuCompute(document.getElementById('pageContainer'));
      if (window.lucide) lucide.createIcons();
    }
    function setGpuProvider(p) {
      state.gpuProvider = p;
      renderGpuCompute(document.getElementById('pageContainer'));
      if (window.lucide) lucide.createIcons();
    }
    function toggleGpuNodeInclude(id) {
      const n = state.nodes.find(x => x.id === id);
      if (n) n.gpuIncluded = !n.gpuIncluded;
      renderGpuCompute(document.getElementById('pageContainer'));
      if (window.lucide) lucide.createIcons();
    }
    async function dispatchGpuBatch() {
      try {
        const resp = await fetch('/api/gpu/run', {
          method: 'POST',
          body: JSON.stringify({
            task_type: 'training',
            source_code: state.cudaSource,
            batches: 20
          })
        });
        const res = await resp.json();
        showToast(`GPU task ${res.job_id || 'completed'} (${res.status || 'OK'})`);
        await syncBackend();
        if (res.job_id) openTaskDetail(res.job_id);
      } catch (err) {
        showToast('GPU run failed: ' + err.message, 'warning');
      }
    }

    // =========================================================================

    // =========================================================================
    function renderWorkerSandbox(container) {
      const t1 = state.workerTiers.t1;
      const t2 = state.workerTiers.t2;

              <tbody class="divide-y divide-slate-100 text-xs">
                ${filtered.map(n => `
                  <tr class="hover:bg-slate-50/70">
                    <td class="py-3 px-3 font-semibold text-slate-900">${escapeHtml(n.id)}</td>
                    <td class="py-3 px-3 text-slate-600">${escapeHtml(n.lab)}</td>
                    <td class="py-3 px-3 text-slate-700">${n.tier}</td>
                    <td class="py-3 px-3 text-slate-800">${escapeHtml(n.gpuModel)} (${n.vramTotal} GB VRAM)</td>
                    <td class="py-3 px-3">
                      <span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${n.status === 'Online' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${n.status}</span>
                    </td>
                    <td class="py-3 px-3 text-right">
                      <button type="button" onclick="state.selectedTopoNodeId='${n.id}'; navigate('topology');" class="px-2.5 py-1 rounded-lg border border-slate-200 hover:bg-slate-50 text-xs font-semibold text-slate-700">Inspect</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // PAGE 8: LOGS
    // =========================================================================
    function renderLogs(container) {
      const cats = ['All', 'Coordinator', 'Worker', 'Tasks', 'Network'];
      const shown = state.logs.filter(l => {
        const matchCat = state.logTab === 'All' || l.cat === state.logTab;
        const matchSev = state.logSeverity === 'All' || l.sev === state.logSeverity;
        const matchQ = (l.src + ' ' + l.type + ' ' + l.msg).toLowerCase().includes(state.logSearch.toLowerCase());
        return matchCat && matchSev && matchQ;
      });

      container.innerHTML = `
        <div class="bg-white rounded-xl border border-slate-200 p-5 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap gap-1.5">
              ${cats.map(c => `<button type="button" onclick="state.logTab='${c}'; renderLogs(document.getElementById('pageContainer')); if(window.lucide) lucide.createIcons();" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${state.logTab === c ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${c}</button>`).join('')}
            </div>
            <div class="flex items-center gap-2">
              <button type="button" onclick="state.logs=[]; renderLogs(document.getElementById('pageContainer'));" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-xs font-semibold text-slate-700">Clear</button>
            </div>
          </div>

          <div class="rounded-xl border border-slate-200 overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[680px]">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500">
                  <th class="py-2.5 px-3">Time</th>
                  <th class="py-2.5 px-3">Level</th>
                  <th class="py-2.5 px-3">Source</th>
                  <th class="py-2.5 px-3">Event</th>
                  <th class="py-2.5 px-3">Message</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-xs">
                ${shown.length ? shown.map(l => `
                  <tr class="hover:bg-slate-50/70">
                    <td class="py-2.5 px-3 font-mono-code text-slate-500">${l.ts}</td>
                    <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${l.sev === 'Error' ? 'bg-rose-50 text-rose-700' : l.sev === 'Warning' ? 'bg-amber-50 text-amber-700' : 'bg-sky-50 text-sky-700'}">${l.sev}</span></td>
                    <td class="py-2.5 px-3 font-semibold text-slate-800">${escapeHtml(l.src)}</td>
                    <td class="py-2.5 px-3 text-slate-700">${escapeHtml(l.type)}</td>
                    <td class="py-2.5 px-3 text-slate-600">${escapeHtml(l.msg)}</td>
                  </tr>
                `).join('') : '<tr><td colspan="5" class="py-8 text-center text-slate-500">No matching logs.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // PAGE 9: SETTINGS
    // =========================================================================
    function renderSettings(container) {
      const s = state.settings;
      container.innerHTML = `
        <div class="bg-white rounded-xl border border-slate-200 p-6 space-y-5 max-w-3xl">
          <div class="flex items-center justify-between border-b border-slate-100 pb-4">
            <div>
              <h2 class="text-base font-bold text-slate-900">Node &amp; Cluster Settings</h2>
              <p class="text-xs text-slate-500 mt-0.5">Configure coordinator identity and GPU thermal limits</p>
            </div>
            <button type="button" onclick="saveSettings()" class="px-4 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold">Save</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div>
              <label class="block font-semibold text-slate-700 mb-1.5">Coordinator Name</label>
              <input value="${escapeHtml(s.coordinatorName)}" oninput="state.settings.coordinatorName=this.value" class="w-full px-3 py-2 rounded-lg border border-slate-200" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1.5">GPU Thermal Limit (°C)</label>
              <input type="number" min="65" max="95" value="${s.gpuThermalCutoff}" oninput="state.settings.gpuThermalCutoff=Number(this.value)" class="w-full px-3 py-2 rounded-lg border border-slate-200 font-mono-code" />
            </div>
          </div>
        </div>
      `;
    }

    async function saveSettings() {
      try { localStorage.setItem('unicompute_settings_v1', JSON.stringify(state.settings)); } catch (e) {}
      try {
        await fetch('/api/coordinator/settings', { method: 'POST', body: JSON.stringify({ pool_id: state.settings.coordinatorName }) });
      } catch (e) {}
      updateChrome();
      showToast('Settings saved');
    }

    // =========================================================================
    // PAGE 10: DESIGN NOTES
    // =========================================================================
    function renderAttribution(container) {
      container.innerHTML = `
        <div class="bg-white rounded-xl border border-slate-200 p-6 space-y-3 max-w-2xl text-xs text-slate-600">
          <h2 class="text-sm font-bold text-slate-900">UniCompute Light UI + Live HIPIFY Backend</h2>
          <p>This interface connects the light Tailwind dashboard directly to the Go backend APIs (<code class="font-mono-code">/api/status</code>, <code class="font-mono-code">/api/gpu</code>, <code class="font-mono-code">/api/gpu/hipify</code>, <code class="font-mono-code">/api/gpu/run</code>, <code class="font-mono-code">/api/tasks</code>, <code class="font-mono-code">/api/storage/*</code>) and executes your local <code class="font-mono-code">hipify-clang.exe</code> for CUDA &rarr; AMD HIP translation.</p>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      navigate('overview');
      syncBackend();
      loadSamplesFromBackend();
      initWebSocket();
      setInterval(syncBackend, 5000);
    });
  </script>
</body>
</html>
